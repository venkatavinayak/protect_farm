[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy API calls directly to the Render FastAPI backend
[[redirects]]
  from = "/api/*"
  to = "https://protectfarm-backend.onrender.com/api/:splat"
  status = 200
  force = false

# SPA fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Performance and Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
