services:
  # FastAPI Web Service on Render (Connecting to MongoDB)
  - type: web
    name: protectfarm-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URL
        sync: false # Set in Render Dashboard: mongodb+srv://<user>:<pass>@cluster.mongodb.net/?retryWrites=true&w=majority
      - key: DATABASE_NAME
        value: protectfarm
      - key: CLERK_SECRET_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
